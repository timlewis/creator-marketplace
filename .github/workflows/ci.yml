name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The integration suites truncate between tests, so they get a database of
  # their own rather than sharing one with anything else in the job.
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The apps import the packages' build output, so those have to exist
      # before anything can be typechecked against them.
      - name: Build workspace packages
        run: pnpm --filter @marketplace/core --filter @marketplace/db --filter @marketplace/api build

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

      # Runs sequentially: the API and worker suites share the database above.
      - run: pnpm test

  images:
    name: Build images
    runs-on: ubuntu-latest
    # Nothing is published from CI - this only proves the images still build,
    # which is the failure that would otherwise surface at deploy time.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, web]
