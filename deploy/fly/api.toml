# Application server. Deploy from the repository root:
#   fly deploy --config deploy/fly/api.toml
app = 'creator-marketplace-api'
primary_region = 'ams'

[build]
  dockerfile = '../../Dockerfile'
  build-target = 'api'

[env]
  PORT = '3000'
  LOG_LEVEL = 'info'
  # This is a demo deployment, so the deadline control stays reachable. It is
  # the one setting here that would be wrong in a real production install.
  ENABLE_DEV_ROUTES = 'true'

# Migrations run once per deploy, before the new machines take traffic - the
# same ordering the Helm pre-upgrade hook gives in Kubernetes.
[deploy]
  release_command = 'node packages/db/dist/migrate.js'
  strategy = 'rolling'

[http_service]
  internal_port = 3000
  force_https = true
  # Kept warm: a reviewer clicking the link should not wait out a cold start.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    method = 'GET'
    timeout = '5s'
    path = '/readyz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
