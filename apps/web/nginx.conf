server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed filenames are immutable; index.html must never be cached or a
  # deploy leaves browsers pinned to the previous bundle.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The application server sits behind the same origin, so the browser never
  # makes a cross-origin request and CORS stays out of the picture.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Single-page app: unknown paths are client-side routes, not 404s.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
